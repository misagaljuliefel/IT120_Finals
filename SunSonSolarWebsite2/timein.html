<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sun Son Solar - Check In</title>
    <link rel="stylesheet" href="SunSonSolar.css" />
    <link rel="stylesheet" href="SunSonSolarPortal.css" />
</head>
<body style="display:none">
    <main class="page" style="max-width:560px">
        <div class="admin-box">
            <h1 style="text-align:center; font-size:26px; margin-bottom:4px;">Check In</h1>
            <p class="center" id="who" style="font-size:18px; margin-bottom:18px;"></p>
            <div id="checkin"></div>
        </div>
    </main>

    <script src="SunSonSolarData.js"></script>
    <script src="SunSonSolarPortal.js"></script>
    <script>
        const user = P.init({ roles: ["technician", "admin"] });
        if (user) {
            document.getElementById("who").textContent = P.fullName(user);
            P.checkin(document.getElementById("checkin"), user);
        }
    </script>
</body>
</html>
