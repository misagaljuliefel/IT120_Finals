<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sun Son Solar - Admin Panel</title>
    <link rel="stylesheet" href="SunSonSolar.css" />
    <link rel="stylesheet" href="SunSonSolarPortal.css" />
</head>
<body style="display:none">
    <main class="page" style="max-width:1250px">
        <h1>Admin Panel</h1>
        <div class="tiles" id="tiles"></div>
        <div class="admin-box">
            <div class="toolbar">
                <h3 style="margin:0">User management</h3>
                <select id="roleFilter" aria-label="Filter by role"><option value="all">Everyone</option><option value="customer">Customers</option><option value="technician">Technicians</option><option value="admin">Admin staff</option></select>
                <input type="search" id="q" class="grow" placeholder="Search name, username or email..." aria-label="Search users" />
                <a class="btn-link" href="employee-new.html">Add employee</a>
            </div>
            <div class="tbl-wrap"><table>
                <thead><tr><th>Name</th><th>Username</th><th>Role</th><th>Department</th><th>Contact</th><th>Status</th><th>Manage</th></tr></thead>
                <tbody id="usersBody"></tbody>
            </table></div>
        </div>
    </main>

    <script src="SunSonSolarData.js"></script>
    <script src="SunSonSolarPortal.js"></script>
    <script>
        const me = P.init({ roles: ["admin"] });
        if (me) {
            function tiles() {
                const b = P.bookings();
                document.getElementById("tiles").innerHTML =
                    '<a class="tile" href="admin-calendar.html"><b>' + b.filter(function (x) { return x.status === "pending"; }).length + "</b><span>Bookings to review</span></a>" +
                    '<a class="tile" href="admin-quotes.html"><b>' + P.get("ssQuotes", []).filter(function (x) { return x.status === "new"; }).length + "</b><span>New quote requests</span></a>" +
                    '<a class="tile" href="admin-inbox.html"><b>' + (P.get("ssReports", []).filter(function (x) { return x.status === "open"; }).length + P.get("ssTickets", []).filter(function (x) { return x.status === "open"; }).length) + "</b><span>Open reports and tickets</span></a>" +
                    '<a class="tile" href="admin-attendance.html"><b>' + getTimeLogs().filter(function (l) { return P.logDate(l) === P.today(); }).length + "</b><span>Checked in today</span></a>";
            }
            function draw() {
                const role = document.getElementById("roleFilter").value, q = document.getElementById("q").value.trim().toLowerCase();
                const list = getAccounts().filter(function (a) {
                    if (role !== "all" && roleOf(a) !== role) return false;
                    return !q || (P.fullName(a) + " " + a.uname + " " + a.email).toLowerCase().indexOf(q) !== -1;
                });
                document.getElementById("usersBody").innerHTML = list.map(function (a) {
                    const self = a.uname === me.uname, isEmp = roleOf(a) !== "customer";
                    const dept = isEmp ? '<select data-dept="' + P.esc(a.uname) + '"' + (self ? " disabled" : "") + ">" + DEPARTMENTS.map(function (d) { return "<option" + (d === a.department ? " selected" : "") + ">" + P.esc(d) + "</option>"; }).join("") + "</select>" : "-";
                    return "<tr><td>" + P.esc(P.fullName(a)) + "</td><td>" + P.esc(a.uname) + "</td><td>" + P.esc(roleOf(a)) + "</td><td>" + dept + "</td><td>" + P.esc(a.email) + "<br>" + P.esc(a.phone) + "</td><td>" +
                        (a.active === false ? '<span class="chip chip-declined">Deactivated</span>' : '<span class="chip chip-completed">Active</span>') + "</td><td>" +
                        (self ? '<span class="muted">You</span>' :
                            '<button class="btn-sm btn-ghost" data-toggle="' + P.esc(a.uname) + '">' + (a.active === false ? "Activate" : "Deactivate") + '</button><button class="btn-sm btn-ghost" data-reset="' + P.esc(a.uname) + '">Reset password</button><button class="btn-sm btn-danger" data-del="' + P.esc(a.uname) + '">Delete</button>') + "</td></tr>";
                }).join("") || '<tr><td colspan="7" class="empty">No users match.</td></tr>';
            }
            function activeAdmins() { return getAccounts().filter(function (a) { return roleOf(a) === "admin" && a.active !== false; }).length; }

            document.getElementById("usersBody").addEventListener("click", function (e) {
                const t = e.target.closest("button");
                if (!t) return;
                if (t.dataset.toggle) {
                    const a = findAccount(t.dataset.toggle), on = a.active === false;
                    if (!on && roleOf(a) === "admin" && activeAdmins() <= 1) { P.toast("You need at least one active admin."); return; }
                    updateAccountKeepSession(a.uname, { active: on });
                    P.toast(P.fullName(a) + (on ? " is active again." : " was deactivated."));
                }
                if (t.dataset.reset) {
                    const a = findAccount(t.dataset.reset), temp = "Sun" + Math.floor(1000 + Math.random() * 9000) + "!";
                    if (!confirm("Reset the password for " + P.fullName(a) + "?")) return;
                    updateAccountKeepSession(a.uname, { password: temp });
                    alert("Temporary password for " + a.uname + ":\n\n" + temp + "\n\nShare it privately and ask them to change it in Account Settings.");
                }
                if (t.dataset.del) {
                    const a = findAccount(t.dataset.del);
                    if (roleOf(a) === "admin" && activeAdmins() <= 1) { P.toast("You need at least one active admin."); return; }
                    if (!confirm("Delete " + P.fullName(a) + "? Their bookings stay on record.")) return;
                    saveAccounts(getAccounts().filter(function (x) { return x.uname !== a.uname; }));
                }
                draw(); tiles();
            });
            document.getElementById("usersBody").addEventListener("change", function (e) {
                const s = e.target.closest("[data-dept]");
                if (!s) return;
                const a = findAccount(s.dataset.dept), role = roleForDepartment(s.value);
                if (roleOf(a) === "admin" && role !== "admin" && activeAdmins() <= 1) { P.toast("You need at least one active admin."); draw(); return; }
                updateAccountKeepSession(a.uname, { department: s.value, role: role });
                P.toast(P.fullName(a) + " is now " + role + ".");
                draw();
            });
            // Edit another user without replacing the signed-in admin's session.
            function updateAccountKeepSession(uname, changes) {
                const keep = sessionStorage.getItem("ssCurrentUser");
                updateAccount(uname, changes);
                sessionStorage.setItem("ssCurrentUser", keep);
            }
            document.getElementById("roleFilter").addEventListener("change", draw);
            document.getElementById("q").addEventListener("input", draw);
            tiles(); draw();
        }
    </script>
</body>
</html>
