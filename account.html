<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sun Son Solar - Account Settings</title>
    <link rel="stylesheet" href="SunSonSolar.css" />
</head>
<body>

    <header class="navbar">
        <div class="logo">Sun Son <span>Solar</span></div>
        <nav class="nav-links">
            <a href="dashboard.html">Dashboard</a>
            <div id="userMenu"></div>
        </nav>
    </header>

    <div class="container">
        <h1>Sun Son Solar</h1>
        <h2>Account Settings</h2>

        <form id="acctForm">
            <label for="fname">First Name:</label>
            <input type="text" id="fname" required/>

            <label for="lname">Last Name:</label>
            <input type="text" id="lname" required/>

            <label for="email">Email:</label>
            <input type="email" id="email" required/>

            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" />

            <label for="address">Address:</label>
            <input type="text" id="address" />

            <label for="uname">Username:</label>
            <input type="text" id="uname" required/>

            <label for="password">New Password:</label>
            <input type="password" id="password" placeholder="Leave blank to keep current password" />

            <label for="cpassword">Confirm New Password:</label>
            <input type="password" id="cpassword" placeholder="Leave blank to keep current password" />

            <button type="submit">Save Changes</button>
        </form>
    </div>

</body>
</html>
