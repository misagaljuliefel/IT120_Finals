<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sun Son Solar - Login</title>
    <link rel="stylesheet" href="SunSonSolar.css" />
</head>
<body>

    <div class="container">
        <h1>Sun Son Solar</h1>
        <h2>Log In</h2>

        <form id="loginForm" action="dashboard.html">
            <label for="uname">Username:</label>
            <input type="text" name="uname" id="uname" required />

            <label for="password">Password:</label>
            <input type="password" name="password" id="password" required />

            <button type="submit">Log In</button>
        </form>

        <p class="form-note">
            New customer? <a href="SunSonSolarRegis1.html">Register here</a><br />
            Joining the team? <a href="SunSonSolarRegist2.html">Register as employee</a>
        </p>
    </div>

    <script src="SunSonSolarData.js"></script>
    <script>
        document.getElementById("loginForm").addEventListener("submit", function (event) {
            event.preventDefault();

            const uname = document.getElementById("uname").value.trim();
            const password = document.getElementById("password").value;

            if (!loginAccount(uname, password)) {
                alert("Incorrect username or password.");
                return;
            }

            window.location.href = "SunSonSolarLanding.html";
        });
    </script>
</body>
</html>
