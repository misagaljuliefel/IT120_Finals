<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sun Son Solar - Admin Panel</title>
    <link rel="stylesheet" href="SunSonSolar.css" />
</head>
<body>

    <header class="navbar">
        <div class="logo">Sun Son <span>Solar</span></div>
        <nav class="nav-links">
            <a href="dashboard.html">Dashboard</a>
            <div id="userMenu"></div>
        </nav>
    </header>

    <div class="admin-wrap">
        <h1 style="text-align:left; margin-bottom:20px;">Admin Panel</h1>

        <div class="admin-box">
            <h3>Registered Users</h3>
            <table>
                <thead>
                    <tr><th>Name</th><th>Username</th><th>Role</th><th>Department</th><th>Email</th></tr>
                </thead>
                <tbody id="usersBody"></tbody>
            </table>
        </div>

        <div class="admin-box">
            <h3>Employee Time-In Log</h3>
            <table>
                <thead>
                    <tr><th>Name</th><th>Time</th><th>Coordinates</th></tr>
                </thead>
                <tbody id="logsBody"></tbody>
            </table>
        </div>
    </div>


</body>
</html>
