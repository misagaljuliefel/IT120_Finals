<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sun Son Solar - Dashboard</title>
    <link rel="stylesheet" href="SunSonSolar.css" />
</head>
<body>

    <header class="navbar">
        <div class="logo">Sun Son <span>Solar</span></div>
        <nav class="nav-links">
            <a href="SunSonSolarLanding.html">Home</a>
            <div id="userMenu">
                <div class="dropdown">
                    <button class="dropdown-btn">My Account</button>
                    <div class="dropdown-menu">
                        <a href="dashboard.html">Dashboard</a>
                        <a href="timein.html">Time In</a>
                        <a href="account.html">Account Settings</a>
                        <a href="admin.html">Admin Panel</a>
                        <a href="SunSonSolarLanding.html">Log Out</a>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <div class="dash-layout">
        <aside class="side-panel">
            <h3>Categories</h3>
            <ul class="cat-list" id="catList">
                <li><button data-cat="all" class="active">All Items</button></li>
                <li><button data-cat="Panels">Panels</button></li>
                <li><button data-cat="Inverters">Inverters</button></li>
                <li><button data-cat="Batteries">Batteries</button></li>
                <li><button data-cat="Racking & Mounting">Racking &amp; Mounting</button></li>
                <li><button data-cat="Wires">Wires</button></li>
                <li><button data-cat="Consultation">Consultation</button></li>
                <li><button data-cat="Designing">Designing</button></li>
                <li><button data-cat="Permitting">Permitting</button></li>
                <li><button data-cat="Installation">Installation</button></li>
                <li><button data-cat="Maintenance">Maintenance</button></li>
                <li><button data-cat="Repair">Repair</button></li>
                <li><button data-cat="Monitoring">Monitoring</button></li>
            </ul>
        </aside>

        <main class="dash-main">
            <div class="dash-toolbar">
                <button class="tab-btn active" data-type="all">All</button>
                <button class="tab-btn" data-type="product">Products</button>
                <button class="tab-btn" data-type="service">Services</button>
                <input type="search" id="searchBox" placeholder="Search..." />
            </div>

            <div class="product-grid" id="catalogGrid"></div>

            <div class="quote-section">
                <h3>My Quote List</h3>
                <div id="quoteList"></div>
                <button id="sendInquiry" style="margin-top:15px;">Send Inquiry to Sun Son Solar</button>
            </div>
        </main>
    </div>

    <script src="SunSonSolarData.js"></script>
    <script>
        const user = requireLogin();
        wireUserMenu();

        let activeCat = "all";
        let activeType = "all";

        function renderCatalog() {
            const q = document.getElementById("searchBox").value.trim().toLowerCase();
            const grid = document.getElementById("catalogGrid");
            const cart = getQuoteList();

            const items = CATALOG.filter(function (item) {
                if (activeCat !== "all" && item.cat !== activeCat) return false;
                if (activeType !== "all" && item.type !== activeType) return false;
                if (q && item.name.toLowerCase().indexOf(q) === -1 && item.cat.toLowerCase().indexOf(q) === -1) return false;
                return true;
            });

            let html = "";
            for (let i = 0; i < items.length; i++) {
                const item = items[i];
                const inCart = cart.some(function (c) { return c.id === item.id; });
                html += '<div class="product-card">' +
                    '<div class="card-content">' +
                    '<h4>' + item.name + '</h4>' +
                    '<p>' + item.desc + '</p>' +
                    '<button data-add="' + item.id + '"' + (inCart ? " disabled" : "") + '>' +
                    (inCart ? "Added to Quote" : "Add to Quote") + '</button>' +
                    '</div></div>';
            }
            grid.innerHTML = html || '<p style="text-align:center;color:#fff;">No items match your search.</p>';

            grid.querySelectorAll("[data-add]").forEach(function (btn) {
                btn.addEventListener("click", function () {
                    const item = CATALOG.find(function (c) { return c.id === btn.dataset.add; });
                    addToQuoteList(item);
                    renderCatalog();
                    renderQuoteList();
                });
            });
        }

        function renderQuoteList() {
            const list = getQuoteList();
            const box = document.getElementById("quoteList");
            if (list.length === 0) {
                box.innerHTML = '<p style="color:#777;">Your quote list is empty. Add products or services above.</p>';
                return;
            }
            let html = "";
            for (let i = 0; i < list.length; i++) {
                html += '<div class="quote-row"><span>' + list[i].name + '</span>' +
                    '<button data-remove="' + list[i].id + '">Remove</button></div>';
            }
            box.innerHTML = html;
            box.querySelectorAll("[data-remove]").forEach(function (btn) {
                btn.addEventListener("click", function () {
                    removeFromQuoteList(btn.dataset.remove);
                    renderQuoteList();
                    renderCatalog();
                });
            });
        }

        document.getElementById("catList").addEventListener("click", function (e) {
            const btn = e.target.closest("button[data-cat]");
            if (!btn) return;
            document.querySelectorAll("#catList button").forEach(function (b) { b.classList.remove("active"); });
            btn.classList.add("active");
            activeCat = btn.dataset.cat;
            renderCatalog();
        });

        document.querySelector(".dash-toolbar").addEventListener("click", function (e) {
            const btn = e.target.closest("button[data-type]");
            if (!btn) return;
            document.querySelectorAll(".tab-btn").forEach(function (b) { b.classList.remove("active"); });
            btn.classList.add("active");
            activeType = btn.dataset.type;
            renderCatalog();
        });

        document.getElementById("searchBox").addEventListener("input", renderCatalog);

        document.getElementById("sendInquiry").addEventListener("click", function () {
            const list = getQuoteList();
            if (list.length === 0) {
                alert("Add at least one item to your quote list first.");
                return;
            }
            alert("Thanks, " + user.fname + "! Your inquiry for " + list.length + " item(s) has been sent to Sun Son Solar.");
            clearQuoteList();
            renderQuoteList();
            renderCatalog();
        });

        renderCatalog();
        renderQuoteList();
    </script>
</body>
</html>
