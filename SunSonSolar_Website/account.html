<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sun Son Solar - Account Settings</title>
    <link rel="stylesheet" href="SunSonSolar.css" />
</head>
<body>

    <header class="navbar">
        <div class="logo">Sun Son <span>Solar</span></div>
        <nav class="nav-links">
            <a href="dashboard.html">Dashboard</a>
            <div id="userMenu">
                <div class="dropdown">
                    <button class="dropdown-btn">My Account</button>
                    <div class="dropdown-menu">
                        <a href="dashboard.html">Dashboard</a>
                        <a href="timein.html">Time In</a>
                        <a href="account.html">Account Settings</a>
                        <a href="admin.html">Admin Panel</a>
                        <a href="SunSonSolarLanding.html">Log Out</a>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <div class="container">
        <h1>Sun Son Solar</h1>
        <h2>Account Settings</h2>

        <form id="acctForm" action="dashboard.html">
            <label for="fname">First Name:</label>
            <input type="text" id="fname" required/>

            <label for="lname">Last Name:</label>
            <input type="text" id="lname" required/>

            <label for="email">Email:</label>
            <input type="email" id="email" required/>

            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" />

            <label for="address">Address:</label>
            <input type="text" id="address" />

            <label for="uname">Username:</label>
            <input type="text" id="uname" required/>

            <label for="password">New Password:</label>
            <input type="password" id="password" placeholder="Leave blank to keep current password" />

            <label for="cpassword">Confirm New Password:</label>
            <input type="password" id="cpassword" placeholder="Leave blank to keep current password" />

            <button type="submit">Save Changes</button>
        </form>
    </div>

    <script src="SunSonSolarData.js"></script>
    <script>
        let user = requireLogin();
        wireUserMenu();

        if (user) {
            document.getElementById("fname").value = user.fname || "";
            document.getElementById("lname").value = user.lname || "";
            document.getElementById("email").value = user.email || "";
            document.getElementById("phone").value = user.phone || "";
            document.getElementById("address").value = user.address || "";
            document.getElementById("uname").value = user.uname || "";
        }

        document.getElementById("acctForm").addEventListener("submit", function (event) {
            event.preventDefault();

            const password = document.getElementById("password").value;
            const cpassword = document.getElementById("cpassword").value;

            if (password !== "" && password.length < 8) {
                alert("New password must be at least 8 characters long.");
                return;
            }
            if (password !== cpassword) {
                alert("New passwords do not match.");
                return;
            }

            const newUname = document.getElementById("uname").value.trim();
            if (newUname.toLowerCase() !== user.uname.toLowerCase() && findAccount(newUname)) {
                alert("That username is already taken.");
                return;
            }

            const updates = {
                fname: document.getElementById("fname").value.trim(),
                lname: document.getElementById("lname").value.trim(),
                email: document.getElementById("email").value.trim(),
                phone: document.getElementById("phone").value.trim(),
                address: document.getElementById("address").value.trim(),
                uname: newUname
            };
            if (password !== "") {
                updates.password = password;
            }

            updateAccount(user.uname, updates);
            alert("Your account has been updated.");
            window.location.href = "dashboard.html";
        });
    </script>
</body>
</html>
