<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sun Son Solar - Time In</title>
    <link rel="stylesheet" href="SunSonSolar.css" />
</head>
<body>

    <header class="navbar">
        <div class="logo">Sun Son <span>Solar</span></div>
        <nav class="nav-links">
            <a href="dashboard.html">Dashboard</a>
            <div id="userMenu">
                <div class="dropdown">
                    <button class="dropdown-btn">My Account</button>
                    <div class="dropdown-menu">
                        <a href="dashboard.html">Dashboard</a>
                        <a href="timein.html">Time In</a>
                        <a href="account.html">Account Settings</a>
                        <a href="admin.html">Admin Panel</a>
                        <a href="SunSonSolarLanding.html">Log Out</a>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <div class="container timein-box">
        <h1>Sun Son Solar</h1>
        <h2>Time In</h2>

        <p class="timein-name" id="userName"></p>

        <form action="dashboard.html">
            <button type="submit" class="timein-btn" id="timeInBtn">TIME IN</button>
        </form>

        <div class="timein-result" id="result">
            <p><strong>Name:</strong> <span id="rName"></span></p>
            <p><strong>Time:</strong> <span id="rTime"></span></p>
            <p><strong>Coordinates:</strong> <span id="rCoords"></span></p>
        </div>
    </div>

    <script src="SunSonSolarData.js"></script>
    <script>
        const user = requireRole(["employee", "admin"]);
        wireUserMenu();

        if (user) {
            document.getElementById("userName").textContent = user.fname + " " + user.lname;
        }

        const timeInForm = document.getElementById("timeInBtn").closest("form");
        timeInForm.addEventListener("submit", function (event) {
            event.preventDefault();

            if (!navigator.geolocation) {
                alert("Location isn't available on this device/browser.");
                return;
            }

            const btn = document.getElementById("timeInBtn");
            btn.disabled = true;
            btn.textContent = "Getting location...";

            navigator.geolocation.getCurrentPosition(
                function (pos) {
                    const now = new Date();
                    const entry = {
                        uname: user.uname,
                        name: user.fname + " " + user.lname,
                        time: now.toLocaleString(),
                        lat: pos.coords.latitude.toFixed(6),
                        lng: pos.coords.longitude.toFixed(6)
                    };
                    addTimeLog(entry);

                    document.getElementById("rName").textContent = entry.name;
                    document.getElementById("rTime").textContent = entry.time;
                    document.getElementById("rCoords").textContent = entry.lat + ", " + entry.lng;
                    document.getElementById("result").classList.add("show");

                    btn.textContent = "TIMED IN";
                },
                function (err) {
                    alert("Couldn't get your location: " + err.message);
                    btn.disabled = false;
                    btn.textContent = "TIME IN";
                }
            );
        });
    </script>
</body>
</html>
