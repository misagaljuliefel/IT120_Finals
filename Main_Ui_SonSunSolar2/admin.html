<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sun Son Solar - Admin Panel</title>
    <link rel="stylesheet" href="SunSonSolar.css" />
    <style>
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-overlay.show {
            display: flex;
        }
        .modal-card {
            background: #fff;
            color: #333;
            padding: 25px;
            border-radius: 8px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .modal-card h3 {
            margin-top: 0;
            margin-bottom: 15px;
        }
        .modal-card label {
            display: block;
            margin-top: 10px;
            font-size: 14px;
            font-weight: bold;
        }
        .modal-card input, .modal-card select {
            width: 100%;
            padding: 8px;
            margin-top: 4px;
            box-sizing: border-box;
        }
        .modal-actions {
            margin-top: 20px;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }
        .modal-actions button {
            padding: 8px 16px;
            cursor: pointer;
        }
        .btn-action-group {
            display: flex;
            gap: 6px;
        }
    </style>
</head>
<body>

    <header class="navbar">
        <div class="logo">Sun Son <span>Solar</span></div>
        <nav class="nav-links">
            <a href="dashboard.html">Dashboard</a>
            <div id="userMenu">
                <div class="dropdown">
                    <button class="dropdown-btn">My Account</button>
                    <div class="dropdown-menu">
                        <a href="dashboard.html">Dashboard</a>
                        <a href="timein.html">Time In</a>
                        <a href="account.html">Account Settings</a>
                        <a href="admin.html">Admin Panel</a>
                        <a href="SunSonSolarLanding.html">Log Out</a>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <div class="admin-wrap">
        <h1 style="text-align:left; margin-bottom:20px;">Admin Panel</h1>

        <div class="admin-box">
            <h3>Registered Users</h3>
            <table>
                <thead>
                    <tr><th>Name</th><th>Username</th><th>Role</th><th>Department</th><th>Email</th><th>Actions</th></tr>
                </thead>
                <tbody id="usersBody"></tbody>
            </table>
        </div>

        <div class="admin-box">
            <h3>Employee Time-In Log</h3>
            <table>
                <thead>
                    <tr><th>Name</th><th>Time</th><th>Coordinates</th></tr>
                </thead>
                <tbody id="logsBody"></tbody>
            </table>
        </div>
    </div>

    <!-- Edit User Modal -->
    <div class="modal-overlay" id="editModal">
        <div class="modal-card">
            <h3>Edit User</h3>
            <form id="editUserForm">
                <input type="hidden" id="editOriginalUname" />

                <label for="editFname">First Name</label>
                <input type="text" id="editFname" required />

                <label for="editLname">Last Name</label>
                <input type="text" id="editLname" required />

                <label for="editEmail">Email</label>
                <input type="email" id="editEmail" required />

                <label for="editRole">Role</label>
                <select id="editRole" required>
                    <option value="customer">customer</option>
                    <option value="employee">employee</option>
                    <option value="admin">admin</option>
                </select>

                <label for="editDepartment">Department</label>
                <input type="text" id="editDepartment" />

                <div class="modal-actions">
                    <button type="button" id="cancelEditBtn">Cancel</button>
                    <button type="submit">Save Changes</button>
                </div>
            </form>
        </div>
    </div>

    <script src="SunSonSolarData.js"></script>
    <script>
        requireRole(["admin"]);
        wireUserMenu();

        function renderUsers() {
            const accounts = getAccounts();
            const currentUser = getCurrentUser();
            let usersHtml = "";

            for (let i = 0; i < accounts.length; i++) {
                const a = accounts[i];
                usersHtml += "<tr>" +
                    "<td>" + a.fname + " " + a.lname + "</td>" +
                    "<td>" + a.uname + "</td>" +
                    "<td>" + a.role + "</td>" +
                    "<td>" + (a.department || "-") + "</td>" +
                    "<td>" + (a.email || "-") + "</td>" +
                    "<td>" +
                        '<div class="btn-action-group">' +
                            '<button data-edit-user="' + a.uname + '">Edit</button>' +
                            '<button data-remove-user="' + a.uname + '">Remove</button>' +
                        '</div>' +
                    "</td>" +
                    "</tr>";
            }

            const body = document.getElementById("usersBody");
            body.innerHTML = usersHtml || '<tr><td colspan="6">No registered users found.</td></tr>';

            // Edit buttons
            body.querySelectorAll("[data-edit-user]").forEach(function (btn) {
                btn.addEventListener("click", function () {
                    const uname = btn.dataset.editUser;
                    const acc = findAccount(uname);
                    if (!acc) return;

                    document.getElementById("editOriginalUname").value = acc.uname;
                    document.getElementById("editFname").value = acc.fname || "";
                    document.getElementById("editLname").value = acc.lname || "";
                    document.getElementById("editEmail").value = acc.email || "";
                    document.getElementById("editRole").value = acc.role || "customer";
                    document.getElementById("editDepartment").value = acc.department || "";

                    document.getElementById("editModal").classList.add("show");
                });
            });

            // Remove buttons
            body.querySelectorAll("[data-remove-user]").forEach(function (btn) {
                btn.addEventListener("click", function () {
                    const unameToRemove = btn.dataset.removeUser;

                    if (confirm("Are you sure you want to remove user '" + unameToRemove + "'?")) {
                        deleteAccount(unameToRemove);

                        if (currentUser && currentUser.uname.toLowerCase() === unameToRemove.toLowerCase()) {
                            logoutAccount();
                            window.location.href = "login.html";
                        } else {
                            renderUsers();
                        }
                    }
                });
            });
        }

        // Modal Form Submit
        document.getElementById("editUserForm").addEventListener("submit", function (e) {
            e.preventDefault();
            const originalUname = document.getElementById("editOriginalUname").value;

            const updates = {
                fname: document.getElementById("editFname").value.trim(),
                lname: document.getElementById("editLname").value.trim(),
                email: document.getElementById("editEmail").value.trim(),
                role: document.getElementById("editRole").value,
                department: document.getElementById("editDepartment").value.trim()
            };

            updateAccount(originalUname, updates);
            document.getElementById("editModal").classList.remove("show");
            renderUsers();
        });

        // Modal Cancel
        document.getElementById("cancelEditBtn").addEventListener("click", function () {
            document.getElementById("editModal").classList.remove("show");
        });

        renderUsers();

        const logs = getTimeLogs();
        let logsHtml = "";
        for (let i = 0; i < logs.length; i++) {
            const l = logs[i];
            logsHtml += "<tr><td>" + l.name + "</td><td>" + l.time + "</td><td>" + l.lat + ", " + l.lng + "</td></tr>";
        }
        document.getElementById("logsBody").innerHTML = logsHtml || '<tr><td colspan="3">No time-in records yet.</td></tr>';
    </script>
</body>
</html>
